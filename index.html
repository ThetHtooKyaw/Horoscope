<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horoscope App</title>
    <link href="./css/main.css" rel="stylesheet" />
    <script src="./js/main.js" type="module"></script>
  </head>
  <body>
    <!-- Loader -->
    <div id="loader">
      <div class="loader-animater"></div>
    </div>

    <!-- Wheel of Fortune -->
    <div class="wheel-container">
      <img class="pointer" src="assets/images/pointer.webp" alt="Pointer" />
      <img
        class="zodiac-wheel"
        src="assets/images/zodiac_wheel_white.webp"
        alt="Zodiac Wheel"
      />
    </div>

    <!-- Slider Container -->
    <div class="slider-container">
      <!-- Year Slider -->
      <div id="step-1" class="slider-row animate-fade-up">
        <p class="slider-label">Under Which Year's Sky<br />Were You Born?</p>
        <div class="slider-shell">
          <div id="year-slider" class="slider-viewport"></div>
        </div>
        <button id="confirm-year" type="button">Reveal Path</button>
      </div>

      <!-- Month Slider -->
      <div id="step-2" class="slider-row display-none">
        <p class="slider-label">
          In Which Month<br />the Stars Begin to Align?
        </p>
        <div class="slider-shell">
          <div id="month-slider" class="slider-viewport"></div>
        </div>

        <div class="button-container">
          <button id="cancel-month" type="button">Return</button>
          <button id="confirm-month" type="button">Bind Stars</button>
        </div>
      </div>

      <!-- Day Slider -->
      <div id="step-3" class="slider-row display-none">
        <p class="slider-label">
          On Which Day<br />the Alignment Become Complete?
        </p>
        <div class="slider-shell">
          <div id="day-slider" class="slider-viewport"></div>
        </div>
        <div class="button-container">
          <button id="cancel-day" type="button">Return</button>
          <button id="confirm-day" type="button">Seal Destiny</button>
        </div>
      </div>
    </div>
  </body>
</html>
